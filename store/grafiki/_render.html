<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.c{position:relative;overflow:hidden;background:
  radial-gradient(60% 55% at 30% 25%, rgba(165,156,211,.30), transparent 70%),
  radial-gradient(55% 50% at 80% 80%, rgba(125,162,201,.22), transparent 70%),
  radial-gradient(45% 40% at 85% 20%, rgba(213,132,138,.16), transparent 70%),
  #070B14;display:grid;place-items:center}
.c img{display:block;filter:drop-shadow(0 0 40px rgba(237,213,163,.25))}
.star{position:absolute;border-radius:50%;background:#EFEBE2}
.word{font-family:'Cormorant Garamond',serif;font-weight:300;color:#EFEBE2;letter-spacing:.06em;line-height:1}
.word em{font-style:italic;color:#D8B982;letter-spacing:0}
.tag{font-family:'Familjen Grotesk',sans-serif;color:rgba(239,235,226,.75);letter-spacing:.28em;text-transform:uppercase}
</style></head><body>
<div id="icon" class="c" style="width:1024px;height:1024px"><img src="_emblem.webp" style="width:78%"></div>
<div id="mask" class="c" style="width:1024px;height:1024px"><img src="_emblem.webp" style="width:56%"></div>
<div id="feature" class="c" style="width:1024px;height:500px;grid-template-columns:420px 1fr;justify-items:start;padding:0 70px;gap:30px">
  <img src="_emblem.webp" style="width:360px">
  <div><div class="word" style="font-size:128px">CIEŃ <em style="font-size:.6em">festiwal</em></div>
  <div class="tag" style="font-size:19px;margin-top:26px">Program · Mapa · Slow Dating · Dziennik</div></div>
</div>
<script>
for (const id of ['icon','mask','feature']) { const el=document.getElementById(id);
  for (let i=0;i<(id==='feature'?70:45);i++){ const s=document.createElement('span'); s.className='star'; const r=Math.random()*2.4+.6;
    s.style.cssText=`width:${r}px;height:${r}px;left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${Math.random()*.6+.2}`; el.prepend(s);} }
</script></body></html>
