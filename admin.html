<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CIEŃ · panel organizatora</title>
<style>
  :root { --bg:#070B14; --panel:#0D1322; --line:rgba(216,185,130,.18); --gold:#D8B982; --cream:#EFEBE2; --grey:#A7A9B4; --cta:#EF8448; --red:#F2A38A; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--cream); font:15px/1.5 system-ui,-apple-system,sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: 1.9rem; margin: 0 0 4px; }
  h2 { font-family: Georgia, serif; font-weight: 400; font-size: 1.3rem; margin: 32px 0 12px; color: var(--gold); }
  .muted { color: var(--grey); font-size: .9rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  input, textarea, select { width: 100%; background: rgba(239,235,226,.05); color: var(--cream); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; }
  textarea { min-height: 90px; resize: vertical; }
  label { display:block; font-size:.85rem; color: var(--grey); margin: 10px 0 4px; }
  button { font: inherit; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 1px solid var(--line); background: transparent; color: var(--cream); }
  button.cta { background: var(--cta); border-color: var(--cta); color: #1A0F08; font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat b { display:block; font-size: 1.6rem; font-family: Georgia, serif; font-weight: 400; color: var(--gold); }
  .item { border-top: 1px solid var(--line); padding: 12px 0; }
  .item:first-child { border-top: 0; }
  .tag { display:inline-block; font-size:.75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--grey); }
  .tag.new { color: #1A0F08; background: var(--gold); border-color: var(--gold); }
  .err { color: var(--red); min-height: 1.2em; }
  img.ph { width: 56px; height: 56px; object-fit: cover; border-radius: 12px; }
  #login { max-width: 380px; margin: 12vh auto 0; }
</style>
</head>
<body>
<main>
  <section id="login" class="panel">
    <h1>Panel organizatora</h1>
    <p class="muted">Ogłoszenia, zgłoszenia i moderacja Slow Dating. PIN sprawdza serwer.</p>
    <form onsubmit="login(event)">
      <label for="pin">PIN organizatora</label>
      <input id="pin" type="password" autocomplete="current-password" required>
      <p class="err" id="login-err" role="alert"></p>
      <button class="cta" type="submit">Wejdź</button>
    </form>
  </section>

  <section id="panel" hidden>
    <div class="row" style="justify-content:space-between">
      <div><h1>CIEŃ · panel</h1><div class="muted" id="updated"></div></div>
      <button onclick="logout()">Wyloguj</button>
    </div>

    <h2>Liczby</h2>
    <div class="stats" id="stats"></div>

    <h2>Nowe ogłoszenie</h2>
    <form class="panel" onsubmit="announce(event)">
      <label for="a-title">Tytuł (do 120 znaków)</label>
      <input id="a-title" maxlength="120" required>
      <label for="a-body">Treść</label>
      <textarea id="a-body" maxlength="2000"></textarea>
      <label for="a-type">Rodzaj</label>
      <select id="a-type"><option value="info">Informacja</option><option value="warning">Uwaga</option><option value="urgent">Pilne</option></select>
      <label class="row" style="color:var(--cream)"><input id="a-push" type="checkbox" style="width:auto"> Wyślij też powiadomienie na telefony</label>
      <p class="err" id="a-err" role="status"></p>
      <button class="cta" type="submit">Opublikuj</button>
    </form>

    <h2>Zgłoszenia</h2>
    <div class="panel" id="reports"><span class="muted">Ładowanie…</span></div>
  </section>
</main>
<script>
const API = '/.netlify/functions/api';
let PIN = sessionStorage.getItem('cien_admin_pin') || '';

async function call(action, body = {}) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, pin: PIN, ...body }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Błąd ' + r.status);
  return d;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function login(e) {
  e.preventDefault();
  PIN = document.getElementById('pin').value;
  try {
    await call('admin-verify');
    sessionStorage.setItem('cien_admin_pin', PIN);
    show();
  } catch (err) { document.getElementById('login-err').textContent = err.message; }
}
function logout() { sessionStorage.removeItem('cien_admin_pin'); location.reload(); }

async function show() {
  document.getElementById('login').hidden = true;
  document.getElementById('panel').hidden = false;
  await Promise.all([loadStats(), loadReports()]);
  document.getElementById('updated').textContent = 'Stan na ' + new Date().toLocaleTimeString('pl-PL');
}

async function loadStats() {
  const s = await call('admin-stats');
  const L = [['users', 'konta'], ['profiles', 'karty Slow Dating 2027'], ['matches', 'dopasowania'], ['teams', 'drużyny'], ['pushSubs', 'telefony z powiadomieniami'], ['reportsOpen', 'nowe zgłoszenia']];
  document.getElementById('stats').innerHTML = L.map(([k, l]) => `<div class="panel stat"><b>${s[k] ?? 0}</b><span class="muted">${l}</span></div>`).join('');
}

async function loadReports() {
  const el = document.getElementById('reports');
  try {
    const { items } = await call('admin-reports');
    if (!items.length) { el.innerHTML = '<span class="muted">Brak zgłoszeń.</span>'; return; }
    el.innerHTML = items.map(r => `
      <div class="item">
        <div class="row">
          <span class="tag ${r.status === 'nowe' ? 'new' : ''}">${esc(r.status || 'nowe')}</span>
          <span class="muted">${esc(new Date(r.created.replace(' ', 'T')).toLocaleString('pl-PL'))} · ${esc(r.kind || '')}</span>
        </div>
        <p style="margin:.4rem 0">${esc(r.reason)}</p>
        ${r.profile ? `<div class="row">${r.profile.photo ? `<img class="ph" src="${esc(r.profile.photo)}?thumb=100x100" alt="">` : ''}<div><b>${esc(r.profile.nick)}</b><div class="muted">${esc(r.profile.about)}</div></div></div>` : ''}
        <div class="muted">Konto: ${esc(r.targetEmail || 'usunięte')}${r.targetSuspended ? ' · zawieszone' : ''}</div>
        <div class="row" style="margin-top:.5rem">
          ${r.profile ? `<button onclick="act('admin-hide-profile',{id:'${r.profile.id}',hidden:${!r.profile.hidden}})">${r.profile.hidden ? 'Pokaż kartę' : 'Ukryj kartę'}</button>` : ''}
          ${r.target ? `<button onclick="if(confirm('${r.targetSuspended ? 'Przywrócić' : 'Zawiesić'} konto?'))act('admin-suspend',{user:'${r.target}',suspended:${!r.targetSuspended}})">${r.targetSuspended ? 'Przywróć konto' : 'Zawieś konto'}</button>` : ''}
          ${r.status !== 'zamknięte' ? `<button onclick="act('admin-report-status',{id:'${r.id}',status:'zamknięte'})">Zamknij zgłoszenie</button>` : ''}
        </div>
      </div>`).join('');
  } catch (err) { el.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
}

async function act(action, body) {
  try { await call(action, body); await Promise.all([loadReports(), loadStats()]); }
  catch (err) { alert(err.message); }
}

async function announce(e) {
  e.preventDefault();
  const btn = e.submitter; btn.disabled = true;
  const st = document.getElementById('a-err');
  st.textContent = 'Publikuję…';
  try {
    const r = await call('admin-announce', {
      title: document.getElementById('a-title').value, body: document.getElementById('a-body').value,
      type: document.getElementById('a-type').value, push: document.getElementById('a-push').checked,
    });
    st.textContent = r.push ? `Opublikowane. Powiadomienie dotarło do ${r.push.sent} z ${r.push.total} telefonów.` : 'Opublikowane w aplikacji.';
    e.target.reset();
  } catch (err) { st.textContent = err.message; }
  btn.disabled = false;
}

if (PIN) call('admin-verify').then(show).catch(() => sessionStorage.removeItem('cien_admin_pin'));
</script>
</body>
</html>
